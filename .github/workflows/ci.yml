name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: osint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra postgres
      - name: Migrations apply and roll back cleanly
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
        env:
          OSINT_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://postgres:test@localhost:5432/osint_test' || 'sqlite+aiosqlite:///./ci.db' }}
      - name: Tests
        run: uv run pytest -q
        env:
          OSINT_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://postgres:test@localhost:5432/osint_test' || '' }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Boot the stack and check health
        run: |
          docker compose up -d
          for i in $(seq 1 40); do curl -fs localhost:8080/api/auth/status && break; sleep 3; done
          curl -fs localhost:8080/api/auth/status | grep -q needs_setup
      - if: always()
        run: docker compose logs --no-color | tail -200
